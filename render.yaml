# Render Blueprint for the static site (https://render.com/docs/blueprint-spec).
# The dashboard is the source of truth until this file is linked as a Blueprint
# (Dashboard > Blueprints > New Blueprint Instance); the name below matches the existing service.
#
# Do NOT add a catch-all "/* -> /index.html" rewrite: every page exists as a real file,
# and unknown paths must fall through to 404.html with a 404 status.

services:
  - type: web
    runtime: static
    name: Bohemica Studio Website
    branch: master
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./build
    envVars:
      # Render would otherwise install dependencies itself, with its own package manager
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Optional: a GitHub token (no scopes needed) avoids API rate limits for the repository cards
      - key: GITHUB_TOKEN
        sync: false
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Fingerprinted files never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /images/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /og/*
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      # HTML fragments of the former single-page app -> real pages
      - type: redirect
        source: /sections/*
        destination: /
      - type: redirect
        source: /projects/overview.html
        destination: /en/projects/overview/
      - type: redirect
        source: /projects/brand.html
        destination: /en/projects/bohemica-brand/
      - type: redirect
        source: /projects/project-proposal.html
        destination: /en/projects/proposal-example/
      - type: redirect
        source: /projects/media-server.html
        destination: /en/projects/t-mobile/
      - type: redirect
        source: /projects/mmt.html
        destination: /en/projects/mmt/
      - type: redirect
        source: /projects/lancaster-maloney.html
        destination: /en/projects/lancaster-maloney/
      - type: redirect
        source: /projects/subtitle-editor.html
        destination: /en/projects/slideslive/
      - type: redirect
        source: /projects/superflow.html
        destination: /en/projects/superflow/
      - type: redirect
        source: /projects/landing-pages.html
        destination: /en/projects/landing-pages/
      - type: redirect
        source: /projects/branding.html
        destination: /en/projects/branding/
