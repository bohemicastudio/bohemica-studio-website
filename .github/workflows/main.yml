# Checks that the site builds. Deployment is done by Render, which builds master on every push.

name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Processed images and fetched API responses are reused between builds
      - name: Cache images and fetched data
        uses: actions/cache@v6
        with:
          path: |
            build/img
            build/og
            .cache
          key: build-cache-${{ hashFiles('source/images/**', 'lib/og-images.js') }}
          restore-keys: build-cache-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
